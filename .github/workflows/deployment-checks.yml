name: deployment-checks

# CI + DB migration for every push to main. All jobs live in ONE
# workflow on purpose:
#
#   - Ordering: GitHub has no cross-workflow dependencies. Here
#     `secretlint` runs FIRST and gates the whole pipeline (a committed
#     secret must never reach prod), then `check` and `test` run in
#     PARALLEL, and `migrate-db` needs both.
#   - DB migrations run ONLY after the test suite passes, never before.
#     Migrating prod for code whose tests haven't passed would leave the
#     schema ahead of the deployed bundle. So the contract is:
#         secretlint → check & test → migrate prod DB
#   - Time budget: there is no workflow-level timeout in GitHub Actions,
#     so the whole run is bounded by the job timeouts on the critical
#     path: secretlint 2m + max(check 2m, test 4m) + migrate 2m = an
#     ~8m ceiling (typical runs finish in ~4m; PR-only runs are just
#     secretlint + check + test, ~3m). These are fail-fast guards, not
#     targets: a hung job dies here instead of running for the default 6h.
#   - Emails: GitHub sends one notification email per failed workflow run.
#     Two workflows meant up to two emails per push; one workflow means at
#     most one.
#
# The post-deploy PDF/OCR/MCP smoke check runs after every production
# deploy: from scripts/deploy (CLI deploys, with rollback on failure) and
# from the pdf-ocr-smoke job below (auto-deploys on push to main, also with
# rollback). Both share scripts/smoke-check against /api/smoke.
#
# The migrate-db job passes the prod DDL URL directly via the
# DATABASE_URL_UNPOOLED GitHub secret (the same session-pooler URL
# scripts/deploy uses for schema DDL) and runs the same `prisma db
# update` sync as scripts/deploy step 3. The CI VERCEL_TOKEN can't
# read project settings (403 PROJECT_UNAUTHORIZED) so `vercel env
# pull` doesn't work here.
#
# NOTE: the job names are stable; keep them that way.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Whole-repo secret scan (tokens, keys, credentials); runs FIRST and
  # gates everything below: check/test/migrate don't start until it
  # passes, so a committed secret never reaches prod. Runs on PRs too.
  # --format github emits inline PR annotations on failures; .gitignore is
  # respected (secretlint v13+), so gitignored files (.env*, node_modules,
  # prisma/backup.sql) are never scanned. The scan set is exactly what
  # could reach the repo. Config: .secretlintrc.json
  secretlint:
    name: Secretlint
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec secretlint --format github "**/*"

  # Static checks (fmt, lint, types): no database, no browsers. Runs in
  # parallel with the test job (after the secretlint gate).
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [secretlint]
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # No `version` input: read pnpm@11.20.0 from package.json's
        # packageManager field so the runner can never drift from the repo.
        # Pinning a version here made the action fail with
        # ERR_PNPM_BAD_PM_VERSION when the two disagreed.

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  # Full test suite against a throwaway Postgres. The Playwright browser
  # tests (closed-reports, editor-create-report, home, mileage) add ~2m
  # on top of the ~2m unit-test core; a cold-cache run with browser
  # install hits ~5-6m, so 10m leaves headroom for flaky CI runners.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [secretlint]
    services:
      # Matches the hardcoded test URL in vite.config.ts:
      # postgres://assaf@localhost/expense_test (passwordless)
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: assaf
          POSTGRES_DB: expense_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assaf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # initStore bootstraps an account from these on an empty database
      # (tests force-reset the schema, so they must be present).
      APP_EMAIL: testuser@example.com
      APP_PASSWORD: test-password
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      # Runs the real tesseract OCR round-trip in test/pdf-ocr.test.ts
      # (downloads eng.traineddata from a CDN; skipped locally by default).
      RUN_OCR_TESTS: "1"
      # Defense-in-depth: launchServer already pins this for the spawned
      # server, but CI has no .env, so keep the /emails page on the configured
      # branch even if the pin ever regresses (Aug 2026 flake, see
      # docs/../commit 014a9c6f).
      EMAIL_TOKEN_ENCRYPTION_KEY: AQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQEBAQE=
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Emit the contract artifacts (contract.json/d.ts are committed, but
      # re-emitting keeps the build honest about drift on a fresh checkout.
      - run: pnpm build:prisma

      # Playwright browsers are not installed by pnpm install; the E2E tests
      # launch headless Chromium, so download it (with OS deps) first, and
      # cache the browsers so the ~20-40s install only happens once per lockfile.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test

  # Production schema sync: runs ONLY after the test suite passes (never
  # before; a migration applied for code that later fails CI would leave prod
  # ahead of the deployed bundle).
  migrate-db:
    name: Migrate prod DB
    runs-on: ubuntu-latest
    # 2m, not 1m: the job must fit checkout + pnpm self-installer + node
    # setup + pnpm install + prisma db update, and a cold runner eats ~55s on
    # the setup alone (the pnpm/action-setup self-installer alone took 27s
    # on 2026-08-06, killing a 1m job before db push could start).
    timeout-minutes: 2
    needs: [check, test]
    # `success()` keeps the default skip-on-failure semantics (no migration
    # when check or test failed) on top of the main-only gate.
    if: success() && github.ref == 'refs/heads/main'
    env:
      # Prod DDL URL (Supabase session pooler), the same value scripts/deploy
      # pulls from Vercel as DATABASE_URL_UNPOOLED. Required; the job fails
      # fast if the secret is missing.
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Auto-deploys (git push to main) reach prod without scripts/deploy,
      # so this job is the schema-sync path for them: same command and URL
      # as scripts/deploy step 3. The psql precheck fails fast with a
      # sharper error than prisma's on network/secret issues.
      - name: Verify prod database connectivity
        run: |
          psql "$DATABASE_URL" -c 'SELECT 1' -tA
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_UNPOOLED }}

      # The old "CLI driver lacks TLS" demotion is stale: the CLI reaches
      # the session pooler with sslmode=no-verify (proven 2026-08-31 when
      # EXPENSE-W's missing EmailConnection columns were synced by hand).
      # Hard failure on any sync problem: a red run is the signal that a
      # push landed schema-out-of-sync.
      - name: Sync prod schema
        run: |
          export DATABASE_URL="$DATABASE_URL_UNPOOLED"
          DB_NAME=$(printf '%s' "$DATABASE_URL" | sed -E 's|.*/([^/?]+)(\?.*)?$|\1|')
          pnpm prisma db update --no-interactive --confirm "$DB_NAME"

  # Post-deploy PDF/OCR/MCP smoke + auto-rollback for Vercel auto-deploys.
  # Pushes to main deploy to production without scripts/deploy, so this job
  # waits for the new production deployment (matched by the pushed commit
  # SHA), runs the same smoke scripts/deploy uses, and rolls the deployment
  # back if it fails. Broken code is live for minutes, not until the next
  # deploy. Skips (with a missing-secret message in the logs) until the
  # SMOKE_TEST_SECRET and VERCEL_PROTECTION_BYPASS GitHub secrets exist;
  # VERCEL_TOKEN is already used by other jobs.
  pdf-ocr-smoke:
    name: Smoke prod + rollback
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [migrate-db]
    # No secrets in this condition: the secrets context is rejected in
    # job-level `if` (workflow file error). Missing secrets are handled
    # inside the step below, which skips the gate with a notice.
    if: success() && github.ref == 'refs/heads/main'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      SMOKE_TEST_SECRET: ${{ secrets.SMOKE_TEST_SECRET }}
      VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
      # Team scope for the Vercel API + CLI (matches the vercel env output).
      VERCEL_TEAM: assafs-projects-a315fe37
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      # Wait for the production deployment of this commit (Vercel auto-
      # deploys ~1-2 min after push), smoke it, and roll it back on
      # failure. One step on purpose: the wait/rollback flow must not
      # depend on cross-step state. Skipped with a notice when the smoke
      # secrets aren't configured (CLI deploys still gate via
      # scripts/deploy).
      - name: Smoke production deployment + rollback on failure
        run: |
          if [ -z "$SMOKE_TEST_SECRET" ] || [ -z "$VERCEL_PROTECTION_BYPASS" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "Smoke secrets not configured as GitHub secrets — skipping the auto-deploy smoke gate."
            echo "Add SMOKE_TEST_SECRET and VERCEL_PROTECTION_BYPASS to enable it."
            exit 0
          fi
          URL=""
          for i in $(seq 1 60); do
            URL=$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
              "https://api.vercel.com/v6/deployments?teamId=$VERCEL_TEAM&target=production&limit=1" \
              | node -e 'let b="";process.stdin.on("data",c=>b+=c);process.stdin.on("end",()=>{const j=JSON.parse(b);const d=j.deployments&&j.deployments[0];if(d&&d.state==="READY"&&d.meta&&d.meta.githubCommitSha==="'$GITHUB_SHA'"&&d.url){console.log("https://"+d.url)}else{process.exit(1)}})') \
              && break
            sleep 5
          done
          if [ -z "$URL" ]; then
            echo "No production deployment for $GITHUB_SHA after 5 minutes" >&2
            exit 1
          fi
          echo "Deployment ready: $URL"
          if ./scripts/smoke-check "$URL"; then
            echo "Smoke passed — deployment stays live."
          else
            echo "Smoke FAILED on $URL — rolling back to the previous deployment." >&2
            npx vercel@latest rollback "$URL" --yes --scope "$VERCEL_TEAM" || echo "Rollback failed — check the Vercel dashboard." >&2
            exit 1
          fi
