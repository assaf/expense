# Publish server.json to the Official MCP Registry (registry.modelcontextprotocol.io)
# on version tags (git tag vX.Y.Z && git push origin vX.Y.Z), or manually via
# workflow_dispatch. Auth is GitHub OIDC: no secrets to store.
#
# This repo's server is REMOTE (https://expense.labnotes.org/mcp); there is
# no npm package, so unlike the registry's npm example this workflow only
# publishes the MCP metadata (server.json).
#
# Note: the registry is in preview; version tags reset the version in
# server.json before publishing. See docs/mcp-directories.md.

name: Publish to MCP Registry

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for OIDC authentication to the registry
      contents: read

    steps:
      - uses: actions/checkout@v5

      - name: Set version in server.json from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          jq --arg v "$VERSION" '.version = $v' server.json > server.tmp && mv server.tmp server.json

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish
