name: deployment-checks

# CI + DB migration + post-deploy smoke checks for every push to main,
# wired into Vercel Deployment Checks. All jobs live in ONE workflow on
# purpose:
#
#   - Ordering: GitHub has no cross-workflow dependencies, so a separate
#     smoke workflow could run (and even pass) before the CI checks finished.
#     Here `check` and `test` run in PARALLEL, `migrate-db` needs both, and
#     `pdf-ocr-smoke` needs all three. The smoke check never starts until CI
#     is done — and when CI fails, the smoke job fails fast instead of being
#     skipped (GitHub reports a skipped job as success, which could let
#     Vercel promote a broken build).
#   - DB migrations run ONLY after the test suite passes — never before.
#     Migrating prod for code whose tests haven't passed would leave the
#     schema ahead of the deployed bundle; and without the migration,
#     `pdf-ocr-smoke` runs the deployed code against an out-of-date schema
#     and fails on any schema change. So the deploy contract is:
#         check & test → migrate prod DB → pdf-ocr-smoke
#   - Time budget: there is no workflow-level timeout in GitHub Actions, so
#     the whole run is bounded by the job timeouts on the critical path —
#     max(check 2m, test 4m) + migrate 1m + smoke 2m = a ~7m ceiling
#     (typical runs finish in ~4.5m; PR-only runs are just check + test,
#     ~3m). These are fail-fast guards, not targets: a hung job dies here
#     instead of running for the default 6h. A literal 5-minute ceiling
#     isn't possible without flaky failures — the test suite alone floors at
#     ~3m and the smoke function can take up to a minute on a cold start.
#   - Emails: GitHub sends one notification email per failed workflow run.
#     Two workflows meant up to two emails per push; one workflow means at
#     most one.
#
# The smoke check locates the Vercel production deployment for this commit,
# curls its /api/smoke endpoint (which runs the real pdfkit → pdfjs →
# tesseract pipeline plus full MCP round trips in BOTH protocol eras inside
# the deployed serverless bundle — see app/routes/api.smoke.ts), and fails
# the job when any pipeline is broken.
#
# The migrate-db job does NOT pull env from Vercel: the CI VERCEL_TOKEN is
# denied on the project-settings/team endpoints `vercel env pull` needs (it
# can list deployments — which is all the smoke job uses it for — but 403s
# on project settings, error PROJECT_UNAUTHORIZED). So the job passes the
# prod DDL URL directly via the DATABASE_URL_UNPOOLED GitHub secret (the
# same session-pooler URL scripts/deploy uses for schema DDL) and runs
# `scripts/migrate-prod --ci` (env pull + preflight + one-time conversions
# skipped — all no-ops on the baselined prod DB — just prisma db push +
# migrate resolve, so the job needs no psql).
#
# To make this gate production promotion:
#   1. Add the secrets below (VERCEL_TOKEN, VERCEL_PROJECT_ID, VERCEL_ORG_ID,
#      SMOKE_TEST_SECRET — must equal the SMOKE_TEST_SECRET env var on the
#      Vercel project — VERCEL_PROTECTION_BYPASS, the project's Protection
#      Bypass for Automation secret, needed because deployment URLs are SSO-
#      protected, and DATABASE_URL_UNPOOLED, the prod DDL URL — the migrate-db
#      job uses it directly because the VERCEL_TOKEN can't read project
#      settings).
#   2. Vercel → project → Settings → Build & Deployment → Deployment Checks →
#      Add Checks → provider GitHub → require "pdf-ocr-smoke". Because the
#      smoke job fails when CI or the DB migration fails, that single check is
#      enough to gate promotion; requiring "Check", "Test" or "Migrate prod
#      DB" too is optional.
#   3. Vercel then holds each production deployment (never aliases it to
#      expense.labnotes.org) until the required checks pass.
#
# NOTE: the job names ARE the check names Vercel matches — keep them stable.
# Renaming either requires updating the Deployment Checks settings to match.
# ("Check & Test" was split into "Check" + "Test" — if either was configured
# as a required check in Vercel, re-add it under the new name.)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Static checks (fmt, lint, types) — no database, no browsers. Runs in
  # parallel with the test job.
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # No `version` input: read pnpm@11.20.0 from package.json's
        # packageManager field so the runner can never drift from the repo.
        # Pinning a version here made the action fail with
        # ERR_PNPM_BAD_PM_VERSION when the two disagreed.

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  # Full test suite against a throwaway Postgres. This is the long pole:
  # pnpm test alone is ~2m and the suite floor with install + browsers is
  # ~3m, so 4m is the tightest timeout that doesn't flake on cold-cache
  # runs. Keep the job lean (no pnpm check here; browsers cached).
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 4
    services:
      # Matches the hardcoded test URL in vite.config.ts:
      # postgres://assaf@localhost/expense_test (passwordless)
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: assaf
          POSTGRES_DB: expense_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U assaf"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # initStore bootstraps an account from these on an empty database
      # (tests force-reset the schema, so they must be present).
      APP_EMAIL: testuser@example.com
      APP_PASSWORD: test-password
      SESSION_SECRET: ci-only-session-secret-0123456789abcdef
      # Runs the real tesseract OCR round-trip in test/pdf-ocr.test.ts
      # (downloads eng.traineddata from a CDN; skipped locally by default).
      RUN_OCR_TESTS: "1"
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build imports prisma/generated (gitignored) — pnpm check generates
      # it in the parallel check job, but each job is a fresh checkout.
      - run: pnpm build:prisma

      # Playwright browsers are not installed by pnpm install; the E2E tests
      # launch headless Chromium, so download it (with OS deps) first — and
      # cache the browsers so the ~20-40s install only happens once per lockfile.
      - name: Cache Playwright browsers
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm test

  # Production schema sync — runs ONLY after the test suite passes (never
  # before; a migration applied for code that later fails CI would leave prod
  # ahead of the deployed bundle). Runs concurrently with the Vercel build;
  # pdf-ocr-smoke needs it, so the smoke check never hits an unmigrated DB.
  migrate-db:
    name: Migrate prod DB
    runs-on: ubuntu-latest
    timeout-minutes: 1
    needs: [check, test]
    # `success()` keeps the default skip-on-failure semantics (no migration
    # when check or test failed) on top of the main-only gate.
    if: success() && github.ref == 'refs/heads/main'
    env:
      # Prod DDL URL (Supabase session pooler) — the same value scripts/deploy
      # pulls from Vercel as DATABASE_URL_UNPOOLED. Required; the job fails
      # fast if the secret is missing.
      DATABASE_URL_UNPOOLED: ${{ secrets.DATABASE_URL_UNPOOLED }}
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same schema sync scripts/deploy runs, minus the Vercel env pull,
      # preflight baseline, and one-time conversions (all no-ops on the
      # baselined prod DB): just prisma db push → migrate resolve. No psql
      # needed, which keeps the job under its 1-minute timeout.
      - name: Sync the production database schema
        run: ./scripts/migrate-prod --ci

  pdf-ocr-smoke:
    name: pdf-ocr-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Run the smoke only after CI passes AND the prod DB is migrated. `if:
    # always()` + an explicit guard (instead of the default skip-on-failure)
    # so a broken build or failed migration reports a failing smoke check to
    # Vercel rather than a skipped/passing one. 2 minutes covers the
    # deployment wait plus a cold /api/smoke (the route's function cap is 60s).
    needs: [check, test, migrate-db]
    if: always() && github.ref == 'refs/heads/main'
    steps:
      - name: Require CI and the DB migration to pass first
        if: needs.check.result != 'success' || needs.test.result != 'success' || needs.migrate-db.result != 'success'
        run: |
          echo "::error::Not running the PDF/OCR/MCP smoke check: check=${{ needs.check.result }}, test=${{ needs.test.result }}, migrate-db=${{ needs.migrate-db.result }}."
          exit 1

      - name: Wait for the Vercel production deployment (this commit)
        id: deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for required in VERCEL_TOKEN VERCEL_PROJECT_ID; do
            if [ -z "${!required}" ]; then
              echo "::error::$required is not configured as a GitHub Actions secret (see workflow comments)"
              exit 1
            fi
          done
          # Team scope (optional for personal accounts; required for teams).
          TEAM=""
          if [ -n "$VERCEL_ORG_ID" ]; then
            TEAM="&teamId=${VERCEL_ORG_ID}"
          fi
          API="https://api.vercel.com/v7/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&limit=50${TEAM}"
          DEADLINE=$(( $(date +%s) + 600 ))
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            RESPONSE=$(curl -sS -H "Authorization: Bearer ${VERCEL_TOKEN}" "$API")
            # Fail fast on auth/API errors instead of polling for 10 minutes.
            if echo "$RESPONSE" | jq -e '.error' >/dev/null 2>&1; then
              echo "::error::Vercel API error: $(echo "$RESPONSE" | jq -r '.error.message // .error.code')"
              exit 1
            fi
            URL=$(echo "$RESPONSE" | jq -r --arg sha "$EXPECTED_SHA" '
              [.deployments[] | select(
                ((.meta.githubCommitSha // .meta.commitSha // "") == $sha)
                and (.readyState == "READY" or .readyState == "BLOCKED")
              )] | first | .url // empty')
            if [ -n "$URL" ]; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              echo "Deployment ready: https://$URL"
              exit 0
            fi
            # A build that errored for this commit will never become READY.
            BUILD_ERROR=$(echo "$RESPONSE" | jq -r --arg sha "$EXPECTED_SHA" '
              [.deployments[] | select(
                ((.meta.githubCommitSha // .meta.commitSha // "") == $sha)
                and .readyState == "ERROR"
              )][0] | if . then .errorMessage else empty end')
            if [ -n "$BUILD_ERROR" ]; then
              echo "::error::Vercel production build failed for this commit: $BUILD_ERROR"
              exit 1
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for the Vercel production deployment of $EXPECTED_SHA (check the Vercel dashboard)."
          exit 1

      - name: Run the PDF/OCR/MCP smoke check
        env:
          DEPLOY_URL: ${{ steps.deployment.outputs.url }}
          SMOKE_TEST_SECRET: ${{ secrets.SMOKE_TEST_SECRET }}
          VERCEL_PROTECTION_BYPASS: ${{ secrets.VERCEL_PROTECTION_BYPASS }}
        run: |
          set -euo pipefail
          for required in SMOKE_TEST_SECRET VERCEL_PROTECTION_BYPASS; do
            if [ -z "${!required}" ]; then
              echo "::error::$required is not configured as a GitHub Actions secret (must equal the Vercel project settings)"
              exit 1
            fi
          done
          # x-vercel-protection-bypass: deployment URLs are behind Vercel SSO
          # protection; the bypass lets the check reach the fresh deployment
          # even while Deployment Checks hold it from the production alias.
          BODY=$(curl -sS --fail --retry 3 --retry-delay 5 --retry-connrefused --max-time 120 \
            -H "x-vercel-protection-bypass: ${VERCEL_PROTECTION_BYPASS}" \
            -H "x-smoke-secret: ${SMOKE_TEST_SECRET}" "https://${DEPLOY_URL}/api/smoke")
          echo "$BODY" | node -e '
            let body = "";
            process.stdin.on("data", (c) => (body += c));
            process.stdin.on("end", () => {
              const r = JSON.parse(body);
              if (r.ok !== true) {
                console.error("Smoke check failed:", r.error ?? JSON.stringify(r));
                process.exit(1);
              }
              console.log("PDF + OCR OK —", r.pdfText, "| OCR:", r.ocrText, "| MCP:", r.mcp ? r.mcp.tools + " tools" : "skipped", `(${r.ms}ms)`);
            });
          '
