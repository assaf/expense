name: secretlint

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secretlint:
    name: Secretlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Whole-repo scan. --format github emits PR annotations on failures.
      # .gitignore is respected (secretlint v13+), so gitignored files (.env*,
      # node_modules, prisma/backup.sql) are never scanned — the scan set is
      # exactly what could reach the repo. Config: .secretlintrc.json
      - run: npx secretlint --format github "**/*"
