allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  tesseract.js: true
  # @sentry/cli downloads the sentry-cli binary — needed by the
  # sentryVitePlugin for source-map upload (see vite.config.ts). The
  # node-cpu-profiler native build stays off per the Sentry setup decision
  # (profiling runs without it).
  "@sentry/cli": true
  "@sentry/node-cpu-profiler": false
  msgpackr-extract: true
  workerd: true
  prisma: set this to true or false

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.3.0
  vite-plus: 0.3.0
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
patchedDependencies:
  tesseract.js@7.0.0: patches/tesseract.js@7.0.0.patch
minimumReleaseAgeExclude:
  - "@prisma/cli-engine@0.2.3"
  - "@prisma/orm-family-sql@8.0.0-rc.7"
  - "@prisma/orm-framework@8.0.0-rc.7"
  - "@prisma/orm-postgres@8.0.0-rc.7"
  - "@prisma/orm-target-postgres@8.0.0-rc.7"
  - "@prisma/orm-toolchain@8.0.0-rc.7"
  - "@prisma/composer-cli@0.14.0"
  - "@prisma/composer@0.14.0"
  - prisma@8.0.0-rc.10
