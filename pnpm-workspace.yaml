allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  tesseract.js: true
  # @sentry/cli downloads the sentry-cli binary — needed by the
  # sentryVitePlugin for source-map upload (see vite.config.ts). The
  # node-cpu-profiler native build stays off per the Sentry setup decision
  # (profiling runs without it).
  "@sentry/cli": true
  "@sentry/node-cpu-profiler": false

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - "@prisma/client"
  - "@prisma/engines"
  - prisma

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.7
  vite-plus: 0.2.7
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
patchedDependencies:
  tesseract.js@7.0.0: patches/tesseract.js@7.0.0.patch
