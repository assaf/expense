allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  tesseract.js: true
  # @sentry/cli downloads the sentry-cli binary — needed by the
  # sentryVitePlugin for source-map upload (see vite.config.ts). The
  # node-cpu-profiler native build stays off per the Sentry setup decision
  # (profiling runs without it).
  "@sentry/cli": true
  "@sentry/node-cpu-profiler": false
  msgpackr-extract: true
  workerd: true
  prisma: true
  # Needed for the lints middleware (app/lib/prisma.server.ts).
  "@prisma/orm-family-sql": true

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
patchedDependencies:
  "@voidzero-dev/vite-plus-core@1.4.0": patches/@voidzero-dev__vite-plus-core@1.4.0.patch
  tesseract.js@7.0.0: patches/tesseract.js@7.0.0.patch
# No minimumReleaseAge floor is configured, so there is nothing to exempt
# here. The block that used to sit here named Prisma rc versions the
# lockfile had moved past (and vite-plus 1.0.0-rc.0, now 1.3.0), which read
# as an active policy while excluding nothing. If a floor is ever added,
# list the versions the lockfile actually resolves.
