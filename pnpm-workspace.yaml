allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  tesseract.js: true
  # @sentry/cli downloads the sentry-cli binary — needed by the
  # sentryVitePlugin for source-map upload (see vite.config.ts). The
  # node-cpu-profiler native build stays off per the Sentry setup decision
  # (profiling runs without it).
  "@sentry/cli": true
  "@sentry/node-cpu-profiler": false
  msgpackr-extract: true
  workerd: true
  prisma: true
  # Needed for the lints middleware (app/lib/prisma.server.ts).
  "@prisma/orm-family-sql": true

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0-rc.0
  vite-plus: 1.0.0-rc.0
  vitest: 5.0.1
overrides:
  vite@*: "catalog:"
  vitest@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
patchedDependencies:
  tesseract.js@7.0.0: patches/tesseract.js@7.0.0.patch
minimumReleaseAgeExclude:
  - "@prisma/cli-engine@0.6.1"
  - "@prisma/orm-family-sql@8.0.0-rc.7 || 8.0.0-rc.12"
  - "@prisma/orm-framework@8.0.0-rc.7 || 8.0.0-rc.12"
  - "@prisma/orm-postgres@8.0.0-rc.7 || 8.0.0-rc.12"
  - "@prisma/orm-target-postgres@8.0.0-rc.7 || 8.0.0-rc.12"
  - "@prisma/orm-toolchain@8.0.0-rc.7 || 8.0.0-rc.12"
  - "@prisma/composer-cli@0.14.0 || 0.23.0"
  - "@prisma/composer@0.14.0 || 0.23.0"
  - prisma@8.0.0-rc.17
  - "@voidzero-dev/vite-plus-core@1.0.0-rc.0"
  - "@voidzero-dev/vite-plus-darwin-arm64@1.0.0-rc.0"
  - "@voidzero-dev/vite-plus-darwin-x64@1.0.0-rc.0"
  - "@voidzero-dev/vite-plus-linux-arm64-gnu@1.0.0-rc.0"
  - "@voidzero-dev/vite-plus-linux-arm64-musl@1.0.0-rc.0"
  - "@voidzero-dev/vite-plus-linux-x64-gnu@1.0.0-rc.0"
  - "@voidzero-dev/vite-plus-linux-x64-musl@1.0.0-rc.0"
  - "@voidzero-dev/vite-plus-win32-arm64-msvc@1.0.0-rc.0"
  - "@voidzero-dev/vite-plus-win32-x64-msvc@1.0.0-rc.0"
  - vite-plus@1.0.0-rc.0
