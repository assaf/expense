allowBuilds:
  "@tailwindcss/oxide": true
  esbuild: true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  tesseract.js: true

onlyBuiltDependencies:
  - "@tailwindcss/oxide"
  - esbuild
  - "@prisma/client"
  - "@prisma/engines"
  - prisma

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@0.2.6
  vite-plus: 0.2.6
overrides:
  vite: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
