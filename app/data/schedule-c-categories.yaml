mirror:
  title: "Schedule C expense categories"
  intro: |-
    When you file as a sole proprietor or single-member LLC, business profit and expenses are reported on Schedule C of Form 1040, and Part II of that form is where the expense categories live. These are the {{categoryCount}} lines.
  footer: |-
    Source: [About Schedule C (Form 1040)](https://www.irs.gov/forms-pubs/about-schedule-c-form-1040). Car and truck expenses can also use the standard mileage rate: see [IRS standard mileage rates by year]({{siteUrl}}/mileage-rates). [Expense]({{siteUrl}}/) seeds every new account with this exact list, in this order, so yearly totals line up with the return without re-bucketing.
