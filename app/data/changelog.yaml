# The product changelog at /changelog and its markdown mirror /changelog.md.
# One file, one list: the page and the mirror are built from these fields, so
# a change is written once.
#
# Adding an entry: put it under the date it shipped, with a type
# (feature / improvement / fix) and one sentence. Write it for someone using
# the app, not for someone reading the commits: what they can do now, what got
# better, what stopped being wrong. Plumbing, protocol details, refactors and
# polish on a single control stay out, and when a day's work is one story it
# gets one entry. Newest date first is the convention but not a requirement:
# app/lib/content.server.ts sorts the releases and rejects a malformed date, a
# repeated date, or a type with no label below. The mirror is the surface an
# assistant reads, so an entry has to make sense on its own, without the day's
# other entries.
#
# Filled in at build time: {{siteUrl}}, {{mcpEndpoint}}, {{freeSpots}},
# {{supportEmail}}. See app/lib/content.server.ts.
#
# The oldest group is a summary, not a day: the pre-launch stretch (the app
# being built, 2026-07-30 .. 2026-08-08) is folded into one line per capability
# the app had by then. Keep it that way; a new note goes under its own date.

metaTitle: |-
  Expense changelog: what changed in the app, by date
description: |-
  What changed in Expense, newest first, by date: the new features, improvements and fixes a person using the app can see, from receipt capture and the inbox import to mileage, reports, bank reconciliation, warranties, exports and the MCP server. Written for people using the app and for assistants reading it.
eyebrow: "Changelog"
title: |-
  What changed in Expense
summary: |-
  What changed in the app, newest first, grouped by date. Each entry is
  something a person using the app can see or do: a capability that did not
  exist, a fix for something that was wrong, a change to something that
  already worked. The same list is published as markdown at
  /changelog.md, so a model reading this site can see what changed and when.

intro: |-
  Newest first. The entries are the changes a person using the app can see,
  not the plumbing behind them. The last group is a summary: the nine days of
  building that followed the first commit on 2026-07-30.

typeLabels:
  feature: "New"
  improvement: "Improved"
  fix: "Fixed"

releases:
  - date: "2026-09-23"
    changes:
      - type: fix
        text: "Pressing ? now shows the G E keycap above the logo, the control that goes back to the expenses page."
      - type: fix
        text: "A file can be dropped anywhere on the page, not only over the content area: dropping in the margins used to hand it to the browser instead."
      - type: improvement
        text: "The warranty editor saves with Cmd+Enter and leaves with Escape, like the expense editors, and its Delete button asks first in the same dialog."
      - type: feature
        text: "The home page plays a short demo of the app filing a receipt: the drop, the fields read from the PDF, and the expense on the list."
      - type: feature
        text: "The new Warranties page tracks expiry dates, reads warranty terms from uploaded receipts and PDFs, and reminds you before coverage ends."
      - type: feature
        text: "Warranty terms prefill from a curated merchant policy when the merchant matches, and the prefilled terms stay editable."
      - type: fix
        text: "Merchant warranty and return policy details were corrected, including the Costco return windows and Mattress Firm claims."
  - date: "2026-09-22"
    changes:
      - type: feature
        text: "Confirmation emails show the receipt image inline, so you can check the scan without opening an attachment."
  - date: "2026-09-20"
    changes:
      - type: feature
        text: "The Email page lets you turn off a sender for your workspace without deleting the shared rule, and restore it later."
      - type: feature
        text: "You are emailed when a connected mailbox needs reconnecting because its login stopped working."
      - type: fix
        text: "Emails stranded by a crashed import are retried instead of being left behind."
  - date: "2026-09-18"
    changes:
      - type: feature
        text: "You can connect any JMAP mail server as a receipt source, not only Gmail and FastMail."
  - date: "2026-09-17"
    changes:
      - type: feature
        text: "Insights adds a money checkup of year-to-date findings linked to the rows behind them, and charts for totals, categories and top merchants."
      - type: feature
        text: "The alternatives comparison now says whether each competing app imports receipts from a mailbox, with a source for each claim."
      - type: feature
        text: "A new product facts page covers capture methods, Schedule C lines and pricing."
      - type: fix
        text: "Closing or reopening a report from the Reports page now updates the report you clicked."
  - date: "2026-09-15"
    changes:
      - type: feature
        text: "A support page at /support gives you one address to write to, and what to include."
  - date: "2026-09-14"
    changes:
      - type: feature
        text: "Insights questions can be stopped mid-answer with a Stop button, and the ask box grows to fit questions of up to five lines."
      - type: feature
        text: "Settings lets you change your sign-in email, change your password and close your account."
  - date: "2026-09-13"
    changes:
      - type: fix
        text: "Email connections whose receipt catch-up fails are now flagged in Settings as needing attention."
  - date: "2026-09-12"
    changes:
      - type: improvement
        text: "Bank statements can be dropped anywhere on the reconcile page, not just the upload box, and it takes CSV and PDF files."
      - type: improvement
        text: "Expense lists, expense details and receipt images all load faster."
      - type: fix
        text: "Insight totals and breakdowns are summed to the cent, and a receipt captured twice is reported as a duplicate."
  - date: "2026-09-11"
    changes:
      - type: feature
        text: "The Insights chat can log a purchase or a drive you describe: it prices the trip and files the amount and currency you confirm."
      - type: feature
        text: "Mileage trips now default to one way with a round trip option, and you can save named places in Settings to reuse as trip stops."
      - type: fix
        text: "Changing your password now signs out your other sessions and revokes access for connected apps."
  - date: "2026-09-10"
    changes:
      - type: feature
        text: "Insights understands plain time ranges such as this month or last quarter and sizes the chart and totals to them."
      - type: feature
        text: "Expense search accepts after: and before: dates, or since: and until:, to filter by a date range."
      - type: improvement
        text: "Follow-up questions in Insights can be narrowed by date, category, report, type, or merchant."
      - type: fix
        text: "Insights answers now know today's date, so questions about now give the right answer."
  - date: "2026-09-09"
    changes:
      - type: fix
        text: "The Insights ask box clears after each question, and Enter while an answer is in flight no longer resubmits it."
  - date: "2026-09-08"
    changes:
      - type: feature
        text: "The Insights ask box is now a conversation: each question joins a transcript and is answered from your own totals."
      - type: fix
        text: "Asking Insights about AI spending no longer pulls in hosting and other infrastructure."
  - date: "2026-09-07"
    changes:
      - type: feature
        text: "A new Insights page charts your expenses over time, lists the matches in a table, and takes a filter you can type in plain English."
      - type: feature
        text: "Search takes bare amount comparisons and ranges, so >100, <=50 or amount:100-110 narrow the list on the home page and in Insights."
      - type: feature
        text: "Search knows shorthand (from:, store:, cat:, in:) and everyday words (food, gas), and completes values as you type."
  - date: "2026-09-05"
    changes:
      - type: feature
        text: "Settings has an Emails section where you can unsubscribe, and every marketing email carries a one-click unsubscribe link."
  - date: "2026-09-04"
    changes:
      - type: improvement
        text: "The app, marketing pages and sign-in screens share a new palette: warm paper in light mode and green-tinted graphite in dark mode."
      - type: fix
        text: "Receipts forwarded from a verified address or redirected inside Fastmail are now imported instead of rejected as unverified."
  - date: "2026-09-03"
    changes:
      - type: feature
        text: "Gmail and Google Workspace can be connected as a mailbox, so Expense pulls receipts from Gmail the way it does from Fastmail."
      - type: fix
        text: "The landing page no longer crashes in browsers that block cookies."
  - date: "2026-09-02"
    changes:
      - type: feature
        text: "A /schedule-c-categories page explains each IRS Schedule C expense line in plain language."
      - type: feature
        text: "A /mileage-rates page lists the IRS standard rates for business, medical, moving, and charitable driving."
      - type: fix
        text: "Timestamps in email review, reconcile, settings, and the email list now show your local timezone."
      - type: fix
        text: "Forms and the home navigation fit small screens instead of overflowing."
  - date: "2026-09-01"
    changes:
      - type: feature
        text: "A /connect page walks you through connecting an MCP client, with per-client steps and copy buttons."
      - type: feature
        text: "You can rotate a receipt left or right in the editor, and the rotation is saved."
      - type: fix
        text: "The previous/next buttons in the expense editor now follow the same order as the main expense list."
  - date: "2026-08-31"
    changes:
      - type: feature
        text: "In-page browser agents can read expenses, expense summaries, and reports from the app."
      - type: fix
        text: "Report PDF exports no longer fail when the report name contains non-ASCII characters."
  - date: "2026-08-30"
    changes:
      - type: feature
        text: "Connecting FastMail no longer means pasting an API token: you sign in with FastMail instead."
      - type: fix
        text: "Receipt confirmation emails are sent again for FastMail accounts."
  - date: "2026-08-29"
    changes:
      - type: feature
        text: "The landing page shows how many of the first 100 free accounts have been taken."
  - date: "2026-08-28"
    changes:
      - type: feature
        text: "Foreign-currency receipts convert to USD at the ECB reference rate for the expense date, keeping the original amount and rate."
  - date: "2026-08-27"
    changes:
      - type: feature
        text: "Expense search filters on report:, category:, merchant:, and description:, suggests known values, and shows an exact total."
      - type: improvement
        text: "Email review scans the last 90 days of your inbox instead of the 50 most recent messages."
      - type: improvement
        text: "Bank notification emails no longer land in auto-import, but charge alerts stay available in inbox review."
      - type: fix
        text: "A receipt you import twice, by any route, no longer becomes a second expense, and a failed import retries once."
  - date: "2026-08-26"
    changes:
      - type: feature
        text: "Bank charge alerts that an imported receipt already covers are skipped on the email review page and listed for reference."
      - type: fix
        text: "Exporting a report as PDF no longer fails."
  - date: "2026-08-24"
    changes:
      - type: feature
        text: "Confirmation emails include the original receipt: the body text quoted, or the image or PDF under its original filename."
  - date: "2026-08-23"
    changes:
      - type: fix
        text: "Receipts that arrive by email keep the sender's local date instead of moving to the next day."
  - date: "2026-08-22"
    changes:
      - type: feature
        text: "A Cmd+K command palette adds keyboard navigation, expense search, new-expense shortcuts, and report PDF export."
  - date: "2026-08-21"
    changes:
      - type: feature
        text: "Sign-up now offers a Connect FastMail button that skips the verification email, and there is a password reset flow."
      - type: feature
        text: "A new email review page lists receipt-like emails from a connected mailbox, so each one can be turned into an expense or ignored."
      - type: improvement
        text: "Apple receipts now name the app or subscription plan in the expense."
  - date: "2026-08-20"
    changes:
      - type: feature
        text: "PDF bills with a text layer in a connected mailbox are imported automatically instead of being skipped."
      - type: improvement
        text: "Recurring billers such as Shopify, Conservice, Spectrum, and Verizon are recognized as receipts out of the box."
      - type: fix
        text: "Date defaults and the future-date check now use your local day."
      - type: fix
        text: "Inbox scanning no longer stops at a batch of already-seen emails, so newer bills behind them are imported."
  - date: "2026-08-19"
    changes:
      - type: feature
        text: "Connecting a FastMail account imports its receipts automatically, moves them to Trash, and sends you a confirmation email."
      - type: improvement
        text: "Expense descriptions from email receipts now include the receipt number, so you can tell which email it came from."
      - type: improvement
        text: "Expenses imported from a connected mailbox are parsed locally, without sending your mail to an LLM."
  - date: "2026-08-17"
    changes:
      - type: feature
        text: "Forwarding a receipt and getting the reply now use one address, receipts@labnotes.org, and replies are sent from the app's mailbox."
      - type: feature
        text: "Emailed receipts are picked up the moment they arrive instead of on a scheduled check."
      - type: fix
        text: "A confirmation reply that fails to send is retried once, so senders don't re-forward the receipt and duplicate the expense."
  - date: "2026-08-16"
    changes:
      - type: feature
        text: "The confirmation reply for an emailed receipt now includes the receipt image and the description read from it."
  - date: "2026-08-15"
    changes:
      - type: feature
        text: "Expenses can be dated in the future, on the web editor and through MCP."
      - type: improvement
        text: "Signing in locks for 15 minutes after five failed attempts."
      - type: fix
        text: "An expense with only a receipt image is no longer counted as complete, and mileage expenses now need a category."
  - date: "2026-08-14"
    changes:
      - type: feature
        text: "The expense list shows each expense's description, not just its date and distance."
      - type: feature
        text: "You can drop a receipt file on the expense editor to replace the image and re-read its fields."
  - date: "2026-08-13"
    changes:
      - type: fix
        text: "Excel bank statements whose date column uses real date formatting now import instead of skipping those rows."
  - date: "2026-08-12"
    changes:
      - type: feature
        text: "Emailing or forwarding a receipt now gets a confirmation reply naming the amount and report, with the report's new count and total."
  - date: "2026-08-11"
    changes:
      - type: feature
        text: "The Reports page lists open and closed reports with their counts and totals, and you can add, rename, close, reopen and delete them."
      - type: feature
        text: "Expenses in a closed report are read-only, with the editor fields disabled and the Save button hidden."
  - date: "2026-08-10"
    changes:
      - type: feature
        text: "The app follows your system dark mode setting, including the marketing pages and the map."
      - type: fix
        text: "The app no longer answers messages from its own inbound address, which caused an endless email reply loop."
  - date: "2026-08-08"
    changes:
      - type: feature
        text: "Receipts arrive as a photo, a dragged file or a PDF, with the merchant, amount and category read from the image."
      - type: feature
        text: "Forward a receipt email to your own address and it becomes an expense, once the sender confirms a verification link."
      - type: feature
        text: "Accounts with signup, invite-code joining and isolated data; signing in requires confirming your email first."
      - type: feature
        text: "Mileage trips are mapped stop to stop, priced at the IRS rate for the drive's date and type, and drawn on a map in the report PDF."
      - type: feature
        text: "Reports hold the year's expenses and export as a PDF with the receipts attached or a ZIP with the images and CSV."
      - type: feature
        text: "Reconcile matches an uploaded card statement (CSV, Excel, QuickBooks, OFX/QFX, PDF) against the expenses you logged."
      - type: feature
        text: "Assistants connect over MCP to capture receipts, log mileage, read expenses and build reports."
      - type: feature
        text: "The expense list searches by merchant, description, category, amount or mileage address, and flags possible duplicates."
      - type: improvement
        text: "The app works with a keyboard or a screen reader: landmarks, labeled sections, focus held in dialogs, announced messages."

cta:
  heading: |-
    Free while it is early.
  body: |-
    The first {{freeSpots}} accounts, no card. Everything on this page is
    already in them.

mirror:
  title: "Expense changelog"
  intro: |-
    Entries are typed: New for a capability that did not exist, Improved for a change to something that already worked, Fixed for a defect that was corrected. The oldest group is a summary of the nine days of building that followed the first commit on 2026-07-30.
  footer: |-
    Expense ({{siteUrl}}) is an expense tracker for individuals filing taxes: receipts arrive by photo, screenshot, pasted image, PDF or forwarded email and are read with OCR, categories come from the IRS Schedule C lines, mileage is priced at the IRS rate for the drive date and type, a bank statement reconciles against what was logged, a year exports as a PDF per report or a ZIP with everything, warranty documents become records grouped by what is still covered, and an assistant connects over MCP at {{mcpEndpoint}}. This file lists what changed in the app, with the date of each release. Questions go to {{supportEmail}}.
