# The product changelog at /changelog and its markdown mirror /changelog.md.
# One file, one list: the page and the mirror are built from these fields, so
# a change is written once.
#
# Adding an entry: put it under the date it shipped, with a type
# (feature / improvement / fix) and one sentence. Newest date first is the
# convention but not a requirement: app/lib/content.server.ts sorts the
# releases and rejects a malformed date, a repeated date, or a type with no
# label below. The mirror is the surface an assistant reads, so an entry has
# to make sense on its own, without the day's other entries.
#
# Filled in at build time: {{siteUrl}}, {{mcpEndpoint}}, {{freeSpots}},
# {{supportEmail}}. See app/lib/content.server.ts.

metaTitle: |-
  Expense changelog: every change to the app, by date
description: |-
  Every feature, fix and improvement shipped to Expense, grouped by date, newest first: receipts and the inbox import, mileage, reports, bank reconciliation, warranties, exports, the MCP server and the pages on this site. Written for people using the app and for assistants reading it.
eyebrow: "Changelog"
title: |-
  What changed in Expense
summary: |-
  Every change to the app, newest first, grouped by date. A capability that
  did not exist, a fix for something that was wrong, and a change to
  something that already worked are all notes on this page. The same list is
  published as markdown at /changelog.md, so a model reading this site can
  see what changed and when.

intro: |-
  Newest first. Every entry is a change a person using the app can see. The
  list starts with the first commit on 2026-07-30, so the earliest dates are
  the app being built rather than changes to something already in use.

typeLabels:
  feature: "New"
  improvement: "Improved"
  fix: "Fixed"

