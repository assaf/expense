cta:
  heading: |-
    Free while it is early.
  body: |-
    The first {{freeSpots}} accounts, no card. Everything on this page is
    already in them.

mirror:
  title: "Expense changelog"
  intro: |-
    Entries are typed: New for a capability that did not exist, Improved for a change to something that already worked, Fixed for a defect that was corrected. The list starts with the first commit on 2026-07-30, so the earliest dates are the app being built.
  footer: |-
    Expense ({{siteUrl}}) is an expense tracker for individuals filing taxes: receipts arrive by photo, screenshot, pasted image, PDF or forwarded email and are read with OCR, categories come from the IRS Schedule C lines, mileage is priced at the IRS rate for the drive date and type, a bank statement reconciles against what was logged, a year exports as a PDF per report or a ZIP with everything, warranty documents become records grouped by what is still covered, and an assistant connects over MCP at {{mcpEndpoint}}. This file lists every shipped change with its date. Questions go to {{supportEmail}}.
