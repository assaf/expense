  Expense product facts: free, Schedule C categories, receipt capture, mileage
description: |-
  A self-employed expense tracker in facts: free with no card and no ads, the first {{freeSpots}} accounts while it is early, all {{categoryCount}} IRS Schedule C Part II categories pre-seeded, receipts in by photo, screenshot, drag and drop, paste, PDF or forwarded email, Gmail and Fastmail inbox import, mileage at the IRS rate, bank reconciliation, and PDF or ZIP export.
eyebrow: "Facts"
title: |-
  Expense product facts
summary: |-
  Expense is a free expense tracker for people who file taxes as individuals:
  freelancers, the self-employed, side hustlers. A receipt comes in from a
  photo, a screenshot, a PDF or the mailbox itself; every expense lands under
  an IRS Schedule C category and in a report you name; drives are priced at
  the IRS rate for the date and type; and the year leaves as a PDF per report
  or a ZIP with everything. This page is the short version, in the shape a
  write-up can copy.

