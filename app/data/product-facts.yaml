captureHeading: "How a receipt gets in"
capture:
  - method: "Photo or file"
    what: |-
      Upload an image or a PDF, from a phone or from the desk. HEIC straight off an iPhone is fine.
  - method: "Screenshot"
    what: |-
      A screenshot of an order confirmation counts as a receipt; it goes in like any other image.
  - method: "Drag and drop"
    what: |-
      Drop images or PDFs anywhere on the expense list.
  - method: "Paste"
    what: |-
      Copy a screenshot, press Cmd-V on the page.
  - method: "Forwarded email"
    what: |-
      Forward the receipt email to your account's address. Only senders you approved get through, and the same email cannot be imported twice.
  - method: "Connected mailbox"
    what: |-
      Connect Gmail or Fastmail and the receipts already in the inbox import on their own: merchant, amount and category filled in, nothing to forward. Most expense trackers import from Gmail only; Expense supports Fastmail natively.

categoriesHeading: "IRS Schedule C line items"
categoriesNote: |-
  Every new account starts with these {{categoryCount}} categories, in the
  order the form lists them, so a year's totals line up with your return
  without re-bucketing. The [reference page]({{siteUrl}}/schedule-c-categories)
  has a plain-language note for each line, and mileage on line 9 is priced at
  the [IRS rate]({{siteUrl}}/mileage-rates) for the drive's date and type.

pricingHeading: "What it costs"
pricing:
  - |-
    Free. No card, no trial clock, no ads.
  - |-
    Early access is capped at {{freeSpots}} accounts, and the home page shows how many are claimed.
  - |-
    OCR, categorizing, mileage, reconciliation, exports and the MCP server are all in the free account. There is no paid tier above it.
  - |-
    Your data stays in your account: export it and leave whenever you want.

