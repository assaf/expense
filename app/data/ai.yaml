# The AI-assistant page at /ai and its markdown mirror /ai.md. The shared
# capability, prompt, and security copy lives in mcp.yaml.
# Filled in at build time: {{siteUrl}}, {{mcpEndpoint}}, {{mileage}},
# {{mileagePeriod}}, {{mileageFirstYear}}, {{mileageLastYear}},
# {{supportEmail}}, {{categoryCount}}. See app/lib/content.server.ts.

metaTitle: |-
  Expense: connect your AI assistant
description: |-
  Connect Claude, OpenAI, or any modern AI to the Expense MCP endpoint, or use an AI-capable web browser: capture receipts, log mileage, answer spending questions, and build reports.
eyebrow: "AI assistants"
title: |-
  Connect your AI helper to Expense.
summary: |-
  Expense speaks the Model Context Protocol (MCP) at {{mcpEndpoint}}. Point any MCP client at it, Claude, OpenAI or some other assistant, and sign in with your account to approve the connection. Your assistant then works the same way the web app does: it reads a receipt from a photo or a PDF, logs a drive at the IRS mileage rate, answers a question about your spending, gathers expenses into a report, or reconciles a statement against what you logged.
stepsHeading: |-
  How to connect

steps:
  - title: "Direct your assistant to the endpoint"
    body: |-
      Tell your assistant to connect to {{mcpEndpoint}} (or just add it to your MCP configuration).
  - title: "Log in and grant access"
    body: |-
      Your browser window pops up: sign in to your Expense account and click Allow on the consent page.
  - title: "It’s done. You control it anytime"
    body: |-
      Settings → Agents & API (MCP) lists every connected application. You can disconnect any app.

mcpConfigHeading: "Claude: .mcp.json"
mcpConfigJson: |-
  {
    "mcpServers": {
      "expense": {
        "type": "http",
        "url": "{{mcpEndpoint}}"
      }
    }
  }
connectNote: |-
  No headers or keys. The client discovers the sign-in flow itself. Claude and OpenAI connect the same way. Per-client instructions for Claude, ChatGPT, and more: [Connect with MCP]({{siteUrl}}/connect).
webmcpHeading: |-
  In the browser (WebMCP)
webmcpBody: |-
  In browsers with WebMCP support, the in-page tools are there while you're signed in: list expenses, summarize spending, list reports. Read-only, same data as the MCP server, and anything that writes still goes through the MCP endpoint.
insightsHeading: |-
  In the app, with nothing connected
insightsSummary: |-
  On the Insights page you can ask in plain words ("how much have I spent this year?", "where does my money go?") and the app computes the answer from your own expenses. A question that covers several months comes back with a chart, and lists all expenses behind it.

cta:
  heading: |-
    Your expenses, on speaking terms with your assistant.
  body: |-
    Add your first receipt in under a minute, then connect your assistant whenever you're ready.
  secondaryLabel: "Read the FAQ"

mirror:
  title: "Expense: connect your AI assistant"
  promptsHeading: "Example prompts"
  footer: "No ads."
