metaTitle: |-
  About Expense: an expense tracker built for tax season
description: |-
  Expense is an expense tracker built for tax season: OCR reads your receipts, AI picks the category, drives are logged at the IRS mileage rate, and reports export as PDF or ZIP.
eyebrow: "About"
title: |-
  An expense tracker for tax season.
benefitsHeading: |-
  What do you get
factsHeading: |-
  Key facts

benefits:
  - title: "Free while we're early"
    body: |-
      No credit card, no payment, no ads. Join now while it's free.
  - title: "Stop losing receipts in your photo library"
    body: |-
      The receipts are already on your phone: photo library, screenshots, PDF downloads. Paste one in or forward the email, our OCR+AI pulls out the merchant, amount, and category and files the expense.
  - title: "Email receipts effortless"
    body: |-
      Forward a receipt email to your Expense account and we'll recorded it for you, dated from the original email.
  - title: "Connect your Fastmail account"
    body: |-
      Connect Fastmail and we'll process receipts that land in your inbox: merchant, amount and category filled in, nothing to forward. We ignore newsletters and bank alerts. Connecting Fastmail also scans the last 90 days, so your records start the day you connect.
  - title: "Get your deductions ready on time"
    body: |-
      Every account starts with the categories from IRS Schedule C, so a receipt is filed on the line it belongs to and nothing has to be sorted out at tax time.
  - title: "PDF reports to show your accountant"
    body: |-
      Group your expenses into reports. Download a PDF for each report, or download a ZIP with all receipts, ready to hand to your accountant.
  - title: "Log drives without Excel"
    body: |-
      Map the drive and the app works out the distance and the allowed deduction, at the IRS rate for that date.
  - title: "Reconcile against your monthly statement"
    body: |-
      Upload a credit card or bank statement (PDF, CSV, QuickBooks, Excel) and Expense matches the charges against what you logged. Anything you never logged stands out, and you can reconcile as many statements as you like.
  - title: "Track the warranty, not just the purchase"
    body: |-
      A receipt gets you a deduction; the warranty is what you need when the thing breaks, usually years later, when the paperwork is long gone. Drop a warranty document on the Warranties page and Expense saves it for you. Expense groups warranties by their end date, so you can tell whether something is still covered without digging through a drawer.
  - title: "Share with your family or accountant"
    body: |-
      Invite someone with a code and you all see the same expenses. Your other accounts stay private.
  - title: "Use your personal AI assistant"
    body: |-
      Connect your own AI assistant (Claude, OpenAI, etc) to your Expense account. Drop a receipt into the chat and it gets uploaded and categorized; ask what you spent on flights, or have it build a report for you.
  - title: "Your data belongs to you"
    body: |-
      No ads, no data selling. Your expenses stay in your account, and you can export and leave anytime.

