metaTitle: |-
  About Expense: a free expense tracker built for tax season
description: |-
  Expense is a free expense tracker built for tax season: OCR reads receipts, AI suggests categories, mileage logs at the IRS rate, and PDF or ZIP export is ready when you are.
eyebrow: "About"
title: |-
  Expense – The Free Receipt Tracker for Tax Season.
benefitsHeading: |-
  What do you get
factsHeading: |-
  Key facts

benefits:
  - title: "Free while we're early"
    body: |-
      No credit card, no payment, no ads. Join now while it's free.
  - title: "Stop losing receipts in your gallery"
    body: |-
      Take a photo, take a screenshot, import a receipt or forward a receipt email. The OCR finds the merchant and price while the LLM suggests the category and you just approve it.
  - title: "AI invoice & receipt extraction"
    body: |-
      Drop in a photo, screenshot, or PDF and the OCR and AI pull out the merchant, amount, date, and category, then file the expense. Receipts and invoices alike, whether uploaded, pasted, or forwarded by email. You just review and approve the result.
  - title: "Email receipts effortless"
    body: |-
      Send an email receipt to your account and an expense will be automatically recorded, dated based on the original email for accuracy.
  - title: "Connect your Fastmail account"
    body: |-
      Connect your Fastmail mailbox and every receipt that lands in your inbox is processed automatically: merchant, amount, and category filled in, no forwarding needed. Most other expense apps only auto-import from Gmail; Expense works with Fastmail.
  - title: "Smart pre-classification"
    body: |-
      Every email is screened locally before any AI runs: receipt-like mail gets processed, newsletters and bank alerts are ignored, and merchants you have paid before skip the model entirely. Less noise, faster imports.
  - title: "Retroactive scan (last 90 days)"
    body: |-
      Connect a mailbox and Expense doesn't just watch for new mail: it scans back through your inbox and surfaces the receipt emails already sitting there, so your records start the day you connect, not the day after.
  - title: "Capture PDF attachments"
    body: |-
      A receipt email with a PDF attached is captured whole: the attachment is pulled out, read, and stored with the expense, not just the text in the email body. Works for image attachments too.
  - title: "Get ready with your deductions on time"
    body: |-
      Accounts come pre-filled with the list of categories from the IRS Schedule C lines. Qualify your expenses as tax-deductible.
  - title: "PDF reports to show your accountant"
    body: |-
      Group your expenses into reports named Home, Work, Travel or whatever else you prefer. You'll see the report total in each report.
  - title: "Log drives without Excel"
    body: |-
      Map your drives and the app will calculate the distances and your deduction according to the IRS rate for this year.
  - title: "Duplicates detection"
    body: |-
      Every receipt image is fingerprinted with SHA-256 when it's stored. The same file arriving twice, by any route (upload, forward, connected inbox), is recognized as one receipt: auto-imports skip the second copy, and manual uploads get a duplicate warning before it messes up your totals.
  - title: "Reconcile against your monthly statement"
    body: |-
      Upload a credit card or bank statement (PDF, CSV, QuickBooks, or Excel) and Expense matches every charge against your logged expenses. Any charge without a receipt stands out, so you never miss a deductible expense that slipped through. Reconcile as many statements as you need, even from a card you use for both personal and business spending.
  - title: "Export for the tax time"
    body: |-
      You can download a PDF with each report and its attached receipts or a ZIP with all CSV and the receipts images. Perfect for sending it to your accountant.
  - title: "Share with your family or accountant"
    body: |-
      You can invite someone with a code and everyone will see the same expenses. Your other accounts will remain private.
  - title: "Use your personal AI assistant"
    body: |-
      You can connect your own AI assistant (Claude, OpenAI or any MCP-capable) with your account login. No token needed. Just drop a receipt in the chat and it will be uploaded and categorized for you, ask about flight spend, receive exact totals or build a report with the assistant. One-click disconnect in settings. In Chrome, browser agents also get in-page read tools (WebMCP) without any setup.
  - title: "Your data belongs to you"
    body: |-
      No ads, no data selling. Your expenses stay in your account, and you can export and leave anytime.

