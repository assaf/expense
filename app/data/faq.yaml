metaTitle: |-
  Expense FAQ: expense tracking for tax season with receipt OCR, AI categories, and mileage
description: |-
  Plain answers to common questions about Expense: what it's for, how receipt OCR and AI categories work, whether it tracks mileage or warranties, and how it helps at tax time.
eyebrow: "FAQ"
title: |-
  Frequently Asked Questions

questions:
  - question: "What is Expense?"
    answer: |-
      Expense is a free expense tracker for individuals who file taxes. Drop in a receipt, an image, a screenshot, a PDF or a forwarded email: it finds the merchant and the amount, files it under a Schedule C category, and keeps the totals for your return. Have a look at {{siteUrl}}.
  - question: "Is Expense good for filing taxes?"
    answer: |-
      This is exactly what Expense is meant for. Categories are the Schedule C lines and expenses go into reports you name, Home or Work or client-specific. Mileage is priced at the IRS rate for the date and type of the trip, and the export gives your accountant a PDF per report or a ZIP with everything. Tax filing made boring.
  - question: "How does Expense read and categorize receipts?"
    answer: |-
      Drop in a receipt image or PDF, it reads the merchant and the amount, and an AI suggests a category. You review the details and save the receipt, instead of typing the numbers in yourself. Receipt images can also be pasted with Cmd-V, dragged onto the web page, or forwarded by email.
  - question: "Is Expense free to use?"
    answer: |-
      Yes. No ads. Just create an account, drop in the receipts, and export at tax filing time.
  - question: "Do the categories comply with the IRS?"
    answer: |-
      Absolutely. Every account starts with the category list built from the IRS Schedule C lines, exactly the lines on your tax return, so your yearly totals line up. You can still create your own additional categories.
  - question: "Does Expense track mileage?"
    answer: |-
      Yes. Log a trip using a map and Expense calculates the deduction at the IRS rate for its type and date. The rate table comes with the app, nothing to configure. Mileage rows are exported together with the regular ones.
  - question: "What is the IRS standard mileage rate?"
    answer: |-
      {{mileage}} Expense applies the right rate to each drive by itself, from the date and type. The full table by year: {{siteUrl}}/mileage-rates.
  - question: "Can I add receipts by email?"
    answer: |-
      Yes. Forward a receipt email to your account and the expense is created from it, dated from the original email. Only senders you have approved get through, and the same email cannot be forwarded twice.
  - question: "Does Expense work with Fastmail?"
    answer: |-
      Yes, and it's a big reason people pick Expense over other apps. Connect your Fastmail mailbox and the receipts landing in your inbox are processed for you: merchant, amount and category filled in, no forwarding needed. Most other expense apps only auto-import from Gmail; Expense supports Fastmail natively. (Forwarding a receipt email still works from any provider.)
  - question: "How do I export expenses for my accountant?"
    answer: |-
      Two options: a PDF per report with the receipts attached, or a ZIP with the CSV and every receipt image. Download either one and send it on.
  - question: "What receipt formats are supported?"
    answer: |-
      Images (including HEIC from an iPhone) or PDFs. Either can be uploaded, pasted with Cmd-V, dragged onto the web page, or forwarded by email.
  - question: "How long should I keep receipts for my taxes?"
    answer: |-
      The IRS can assess additional tax for three years after you file, so keep receipts, mileage logs, and statements at least that long. The window stretches to six years if you underreported income by more than 25%, seven years for bad-debt or worthless-securities claims, and indefinitely for a fraudulent or unfiled return. Electronic copies count. Expense keeps the receipt image attached to every expense and exports it with the report, so the archive builds itself.
  - question: "What does the IRS require for a mileage log?"
    answer: |-
      An adequate record shows the miles driven, the date, the destination, and the business purpose of each trip; a year of drives reconstructed from memory does not qualify. For travel expenses generally, the IRS wants documentation for anything $75 or more, plus lodging receipts no matter the amount. Expense logs every drive from the map with its date, route, and applied rate, and keeps that record attached to the expense.
  - question: "What happens if I upload the same receipt twice?"
    answer: |-
      You get a visual warning and you can discard it, or mark it as "not a duplicate". That covers a re-uploaded file and the same email sent twice; every stored image also carries a SHA-256 fingerprint, so the same file arriving by a different route is caught too.
  - question: "Can I reconcile my expenses against a credit card statement?"
    answer: |-
      Yes. Upload a credit card or bank statement in PDF, CSV, QuickBooks (QFX/OFX), or Excel format, and Expense matches every charge against what you logged. Any charge without a matching receipt is flagged, so a deduction you missed stands out. Reconcile as many statements as you like, across cards or months, and a card you use for both personal and business spending is fine. Nothing is written until you confirm which matches to keep and which charges to add as new expenses.
  - question: "Can I track warranties in Expense?"
    answer: |-
      Yes, and it starts the same way a receipt does. Upload the warranty document to the Warranties page (a photo, a PDF, or the terms the retailer sent) and Expense reads the merchant, the product, the purchase date and the expiry from it, then keeps the document attached to the record. Where the merchant is one we have researched, the record starts with their return and coverage terms, and everything stays editable. Records are grouped into what is still in force, what expires within 90 days, what has already expired, and what has no end date, and a warranty can be linked to the expense it came from. Warranties are tracked separately from your expenses, so a warranty for a purchase you never deducted stays out of your tax totals.
  - question: "Can I share Expense with my spouse or accountant?"
    answer: |-
      Yes. Share the invitation code and everyone you invite sees the same expenses. Your other accounts stay completely separate.
  - question: "How do I change my password?"
    answer: |-
      Settings has a Password section: enter your current password, then the new one twice. Changing it signs you out on every other device and disconnects any assistant app, since those were authorized under the old password. If you don't remember the current password, use "Forgot password?" on the login page instead: a single-use link arrives by email and sets a new one.
  - question: "How do I change my email address?"
    answer: |-
      In Settings, open Your email and enter the new address plus your current password. Your old address gets an email telling you it changed, so you find out either way, and the new one gets a link to confirm it before receipts sent from there are accepted.
  - question: "Where is my expense data stored?"
    answer: |-
      In your account only. Expense doesn't serve ads and doesn't sell your data: receipts and expenses stay restricted to your account, and you can export them as PDF or ZIP whenever you want.
  - question: "Is Expense good for freelancers and self-employed people?"
    answer: |-
      It is who Expense was built for. Receipts go in fast, categories come from the Schedule C lines, drives are priced at the IRS rate, and your accountant gets a clean export.
  - question: "Can I use Expense with an AI assistant?"
    answer: |-
      Yes. Expense supports the Model Context Protocol (MCP) at {{mcpEndpoint}}. Point any MCP client at it, Claude, OpenAI or another assistant, and approve the connection by signing in with your account. The assistant can then capture receipts (images or PDFs) through the same OCR pipeline as the web app, log mileage, answer questions about your spending, group expenses into reports, and export a report as a PDF. At any time you can disconnect a connected app, or revoke its access tokens, from Settings. Browsers with WebMCP (Chrome's origin trial) get the same read tools in-page on your signed-in session, nothing to connect or configure.
  - question: "What is Insights?"
    answer: |-
      Insights is the app's own question page, no assistant to connect. Ask in plain words, like "how much have I spent this year?" or "where does my money go?", and the app computes the answer from your expenses: totals for a period, your biggest report, the expenses that still have no report. A question covering several months comes back with a chart, and the chart opens to the exact expenses behind it. The figures come from your records and the model only phrases them, so it can't invent a number.
  - question: "Who makes Expense?"
    answer: |-
      Expense is created and maintained by Assaf Arkin (https://labnotes.org).
  - question: "Can Expense be used as a replacement for Expensify?"
    answer: |-
      Certainly, for personal or small-team expense tracking, and it's free to use. OCR reads the receipt, the categories come from the Schedule C lines, mileage is priced at the IRS rate, statements reconcile against what you logged, and the export is arranged for filing. Expensify is a corporate solution: workflows, reimbursements, accounting integrations, a free tier of 25 SmartScans a month, and paid plans priced per user. If what you need is your expenses arranged for filing taxes, Expense does it, and it is free: no card, no ads, the first {{freeSpots}} accounts while we're early.

