<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Rounded square background with white stroke for dark-mode visibility -->
  <rect x="8" y="8" width="112" height="112" rx="24"
        fill="#0d9488" stroke="#ffffff" stroke-width="2.5"/>
  <!-- Receipt fold corner -->
  <path d="M92 8 L120 36 L92 36 Z"
        fill="#0f766e" stroke="#ffffff" stroke-width="1.5"/>
  <!-- Dollar sign -->
  <text x="64" y="82" text-anchor="middle"
        font-family="system-ui, -apple-system, sans-serif"
        font-size="60" font-weight="700" fill="#ffffff">$</text>
</svg>
