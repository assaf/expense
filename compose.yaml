# Local parity stack: MinIO (S3-compatible blob storage) for the images
# backend. Postgres is expected to run natively (Homebrew: `brew services
# start postgresql@18`) — create the dev DB with `createdb expensify_dev`.
#
# Usage: docker compose up -d
# Console: http://localhost:9001 (minioadmin / minioadmin)
services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data

  # Create the `expensify` bucket once MinIO is up (retries until ready).
  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minioadmin minioadmin; do
        echo waiting for minio…; sleep 1;
      done;
      mc mb --ignore-existing local/expensify;
      echo bucket ready;
      "

volumes:
  minio-data:
