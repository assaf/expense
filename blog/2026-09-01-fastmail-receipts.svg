<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="210" cy="150" r="240" fill="#0d9488" opacity="0.05"/>
  <circle cx="1400" cy="770" r="280" fill="#0d9488" opacity="0.05"/>

  <!-- Left card: inbox -->
  <g filter="url(#shadow)">
    <rect x="140" y="270" width="420" height="340" rx="24" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  </g>
  <!-- Receipt peeking out of the envelope -->
  <path d="M260,334 H440 Q460,334 460,354 V472 L450,478 L440,472 L430,478 L420,472 L410,478 L400,472 L390,478 L380,472 L370,478 L360,472 L350,478 L340,472 L330,478 L320,472 L310,478 L300,472 L290,478 L280,472 L270,478 L260,472 V354 Q260,334 280,334 Z"
        fill="#ffffff" stroke="#d1d5db" stroke-width="1.5"/>
  <rect x="290" y="354" width="120" height="10" rx="5" fill="#e5e7eb"/>
  <rect x="290" y="376" width="90" height="10" rx="5" fill="#0d9488" opacity="0.35"/>
  <!-- Envelope -->
  <rect x="240" y="384" width="220" height="150" rx="14" fill="#f0fdfa" stroke="#99f6e4" stroke-width="1.5"/>
  <path d="M240,386 L350,460 L460,386" fill="#ccfbf1" stroke="#5eead4" stroke-width="1.5" stroke-linejoin="round"/>
  <text x="350" y="476" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="17" font-weight="600" fill="#0f766e">receipt arrives</text>
  <text x="350" y="650" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#6b7280">Inbox</text>

  <!-- Arrow: one continuous shape — rounded left cap, shaft, filleted flare into the head -->
  <path d="M598,430 H962 Q966,430 968,424 L1018,440 L968,456 Q966,450 962,450 H598 A10,10 0 0 1 598,430 Z" fill="#0d9488"/>

  <!-- Right card: expense -->
  <g filter="url(#shadow)">
    <rect x="1040" y="270" width="420" height="340" rx="24" fill="#ffffff" stroke="#e5e7eb" stroke-width="1.5"/>
  </g>
  <rect x="1072" y="312" width="48" height="48" rx="12" fill="#0d9488"/>
  <text x="1096" y="347" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="30" font-weight="700" fill="#ffffff">$</text>
  <text x="1138" y="348" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#0d9488" letter-spacing="-0.5">Expense</text>
  <line x1="1072" y1="384" x2="1428" y2="384" stroke="#f1f5f9" stroke-width="2"/>
  <text x="1072" y="430" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#9ca3af">Merchant</text>
  <text x="1428" y="430" text-anchor="end" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#111827">ACME Web Services</text>
  <text x="1072" y="478" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#9ca3af">Amount</text>
  <text x="1428" y="478" text-anchor="end" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="700" fill="#0d9488">$42.50</text>
  <text x="1072" y="526" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="20" font-weight="500" fill="#9ca3af">Category</text>
  <text x="1428" y="526" text-anchor="end" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="22" font-weight="600" fill="#111827">Office expenses</text>
  <rect x="1330" y="540" width="98" height="34" rx="17" fill="#0d9488"/>
  <text x="1379" y="562" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="18" font-weight="600" fill="#ffffff">✓ Saved</text>
  <text x="1250" y="650" text-anchor="middle" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="30" font-weight="600" fill="#0d9488">Expense</text>
</svg>
